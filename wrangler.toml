# Cloudflare Pages configuration.
#
# The whole app - site and Studio - is static: `astro build` produces plain HTML
# plus assets, so there is no adapter and no Worker runtime. The Studio is a
# client-side React app on hash routing, which means /studio is one HTML file
# and every screen inside it lives after the '#'. That is why it needs no
# server-side catch-all rule.
#
# Deploys are driven by Git: a push to `main` builds production, any other
# branch builds a preview. `pages_build_output_dir` is read by Pages CI and
# overrides the output directory set in the dashboard, so the build output
# lives in version control rather than in a dashboard field.
#
# Manual deploy (rarely needed):  npx wrangler pages deploy dist

name = "ceramic-brussels"
pages_build_output_dir = "./dist"
compatibility_date = "2026-08-01"
# The preview Worker (dist/_worker.js, see below) uses AsyncLocalStorage and
# the rest of the Node surface Astro's server runtime expects.
compatibility_flags = ["nodejs_compat"]

# Build-time environment. Because this file exists, Pages CI ignores the
# environment variables set in the dashboard ("Build environment variables:
# (none found)" in the build log) and reads them from here instead. All of
# these are public: the dataset is ACL-public and the values ship in the client
# bundle anyway. SANITY_API_WRITE_TOKEN must never be added here.
[vars]
PUBLIC_SANITY_PROJECT_ID = "5hqzhin7"
PUBLIC_SANITY_DATASET = "production"
PUBLIC_SITE_URL = "https://ceramic-brussels.pages.dev"
# The preview runtime on production too (2026-09-06): editors use the live
# Studio's Preview tab and share draft links from the real domain. See the
# explanation under [env.preview.vars]; production needs the same
# SANITY_VIEWER_TOKEN secret in the dashboard.
PREVIEW_RUNTIME = "1"
PUBLIC_PREVIEW_ENABLED = "true"

# Branch previews: canonical tags and the sitemap must point at the preview
# host, and editors get an Edit button on every page.
[env.preview.vars]
PUBLIC_SANITY_PROJECT_ID = "5hqzhin7"
PUBLIC_SANITY_DATASET = "production"
PUBLIC_SITE_URL = "https://dev.ceramic-brussels.pages.dev"
PUBLIC_SHOW_EDIT_LINKS = "true"
# The gallery application form on a preview accepts a submission without an
# email service: the Worker logs it and sends the browser on to the thank-you
# page, so the whole flow can be tried before Brevo is connected. Never set
# this on production, where a missing BREVO_API_KEY must refuse.
APPLY_DRY_RUN = "1"
# The preview runtime. PREVIEW_RUNTIME=1 makes `astro build` add the Cloudflare
# adapter and the on-demand /preview and /api/preview routes, and
# scripts/pages-worker.mjs then moves the Worker to dist/_worker.js so Pages
# runs it. PUBLIC_PREVIEW_ENABLED gives the Studio its Preview tab. Both must
# be set together. The Worker also needs the SANITY_VIEWER_TOKEN secret,
# which lives in the dashboard, never here. On for previews and production.
PREVIEW_RUNTIME = "1"
PUBLIC_PREVIEW_ENABLED = "true"
